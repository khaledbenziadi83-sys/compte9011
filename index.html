<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeloFetch – Free Online Video &amp; Audio Downloader</title>
    <meta
      name="description"
      content="Download videos, audio tracks, playlists, thumbnails, and subtitles in up to 4K MP4, WebM, MP3, and WAV from YouTube, TikTok, Instagram, and 1,000+ platforms."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://velofetch.app/" id="canonical-link" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeloFetch" />
    <meta property="og:title" content="VeloFetch – Free Online Video &amp; Audio Downloader" />
    <meta
      property="og:description"
      content="Download videos, audio tracks, playlists, thumbnails, and subtitles in up to 4K MP4, WebM, MP3, and WAV from YouTube, TikTok, Instagram, and 1,000+ platforms."
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeloFetch – Free Online Video &amp; Audio Downloader" />
    <meta
      name="twitter:description"
      content="Download videos, audio tracks, playlists, thumbnails, and subtitles in up to 4K MP4, WebM, MP3, and WAV from YouTube, TikTok, Instagram, and 1,000+ platforms."
    />

    <!-- Typography: Outfit (Display) + DM Sans (Body) + JetBrains Mono (Data/Tabular) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data: WebApplication & FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "VeloFetch",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "All",
            "description": "Free online video and audio downloader supporting MP4, WebM, MP3, M4A, WAV, subtitles, and thumbnails across 1,000+ platforms.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "4K 2160p and 1080p MP4/WebM video extraction",
              "Lossless WAV, 320kbps MP3, and M4A audio extraction",
              "TikTok watermark-free video downloads",
              "Playlist and multi-item batch selection",
              "SRT and VTT subtitle extraction",
              "High-resolution thumbnail downloading"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is VeloFetch completely free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. VeloFetch is 100% free with no registration required, no daily download caps, and no artificial speed throttling."
                }
              },
              {
                "@type": "Question",
                "name": "How do I download TikTok videos without a watermark?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Paste any public TikTok video link into the VeloFetch input box, click Fetch Media, and select the MP4 (No Watermark) stream option."
                }
              },
              {
                "@type": "Question",
                "name": "Does VeloFetch store downloaded videos or user history?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. VeloFetch operates a zero-retention policy. Streams are proxied directly to your browser and any temporary transcoding buffers are automatically purged within 10 minutes."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-slate-900 antialiased selection:bg-blue-600 selection:text-white dark:bg-[#0B0F17] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
